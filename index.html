<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D SCAPE</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1a3a8c;
    --blue-dark: #122a6e;
    --blue-light: #2450b5;
    --white: #ffffff;
    --off-white: #f4f6fb;
    --gray: #e0e4ef;
    --text: #1a2340;
    --accent: #e8b400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Barlow', sans-serif;
    background: #c8cdd8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* PAGES */
  .page { display: none; animation: fadeIn 0.35s ease; }
  .page.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== SPLASH ===== */
  #splash {
    width: 560px;
    height: 360px;
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    position: relative;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35);
    cursor: pointer;
  }

  .stars-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
  }

  .splash-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 4px;
    text-align: center;
  }

  .splash-btn {
    margin-top: 12px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.5);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 2px;
    padding: 5px 18px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s;
  }
  .splash-btn:hover { background: rgba(255,255,255,0.32); }

  /* ===== SHELL (header + content) ===== */
  .shell {
    width: 700px;
    background: var(--off-white);
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .topbar {
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    height: 44px;
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .topbar-brand .logo-star { font-size: 10px; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-profile {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    color: var(--white);
    font-size: 0.72rem;
    letter-spacing: 1px;
    padding: 3px 12px;
    cursor: pointer;
    border-radius: 2px;
    font-family: 'Barlow', sans-serif;
    transition: background 0.2s;
  }
  .btn-profile:hover { background: rgba(255,255,255,0.2); }

  .bell-icon {
    color: var(--white);
    font-size: 1.1rem;
    cursor: pointer;
  }

  /* ===== LISTING PAGE ===== */
  #listing .content { padding: 18px 20px 22px; }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .product-card {
    background: var(--white);
    border: 1px solid var(--gray);
    border-radius: 3px;
    padding: 12px;
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.15s;
  }
  .product-card:hover {
    box-shadow: 0 4px 16px rgba(26,58,140,0.15);
    transform: translateY(-2px);
  }

  .product-card img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 2px;
    background: #dde2ef;
  }

  .product-card-placeholder {
    width: 100%;
    height: 110px;
    background: linear-gradient(135deg, #c8d0e8 0%, #dde2ef 100%);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: var(--blue-light);
  }

  .product-card-name {
    margin-top: 8px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ===== DETAIL PAGE ===== */
  #detail .content {
    padding: 14px 20px 24px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--blue);
    font-family: 'Barlow', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    padding: 0;
    transition: color 0.15s;
  }
  .back-btn:hover { color: var(--blue-light); }
  .back-btn::before { content: '←'; font-size: 1rem; }

  .detail-layout {
    display: grid;
    grid-template-columns: 1fr 200px;
    gap: 20px;
    align-items: start;
  }

  .detail-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
    border-bottom: 2px solid var(--blue);
    padding-bottom: 7px;
  }

  .detail-desc {
    font-size: 0.8rem;
    color: #3a4560;
    line-height: 1.65;
    margin-bottom: 12px;
  }

  .detail-list {
    list-style: none;
    padding: 0;
  }
  .detail-list li {
    font-size: 0.78rem;
    color: #3a4560;
    padding: 3px 0 3px 14px;
    position: relative;
    line-height: 1.5;
  }
  .detail-list li::before {
    content: '•';
    position: absolute;
    left: 0;
    color: var(--blue);
    font-weight: 700;
  }

  .detail-images {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .detail-img-placeholder {
    width: 100%;
    height: 85px;
    background: linear-gradient(135deg, #c8d0e8 0%, #dde2ef 100%);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    color: var(--blue-light);
    border: 1px solid var(--gray);
  }

  /* RESPONSIVE NOTE */
  @media (max-width: 720px) {
    .shell { width: 98vw; }
    .products-grid { grid-template-columns: 1fr 1fr; }
    .detail-layout { grid-template-columns: 1fr; }
    .detail-images { flex-direction: row; flex-wrap: wrap; }
    .detail-img-placeholder { width: 80px; height: 80px; }
  }
</style>
</head>
<body>

<!-- ===== SPLASH ===== -->
<div id="splash" class="page active" onclick="goTo('listing')">
  <div class="stars-grid">
    <!-- top-left cluster -->
    <span class="star" style="top:14%;left:8%">★</span>
    <span class="star" style="top:10%;left:14%">★</span>
    <span class="star" style="top:18%;left:11%">★</span>
    <span class="star" style="top:26%;left:8%">★</span>
    <span class="star" style="top:22%;left:15%">★</span>
    <span class="star" style="top:30%;left:12%">★</span>
    <!-- top-right cluster -->
    <span class="star" style="top:14%;right:8%">★</span>
    <span class="star" style="top:10%;right:14%">★</span>
    <span class="star" style="top:18%;right:11%">★</span>
    <span class="star" style="top:26%;right:8%">★</span>
    <span class="star" style="top:22%;right:15%">★</span>
    <span class="star" style="top:30%;right:12%">★</span>
    <!-- bottom-left cluster -->
    <span class="star" style="bottom:18%;left:8%">★</span>
    <span class="star" style="bottom:12%;left:14%">★</span>
    <span class="star" style="bottom:22%;left:11%">★</span>
    <span class="star" style="bottom:8%;left:8%">★</span>
    <span class="star" style="bottom:14%;left:15%">★</span>
    <span class="star" style="bottom:20%;left:18%">★</span>
    <!-- bottom-right cluster -->
    <span class="star" style="bottom:18%;right:8%">★</span>
    <span class="star" style="bottom:12%;right:14%">★</span>
    <span class="star" style="bottom:22%;right:11%">★</span>
    <span class="star" style="bottom:8%;right:8%">★</span>
    <span class="star" style="bottom:14%;right:15%">★</span>
    <span class="star" style="bottom:20%;right:18%">★</span>
  </div>
  <div class="splash-title">3D SCAPE</div>
  <button class="splash-btn">ENTER</button>
</div>

<!-- ===== LISTING PAGE ===== -->
<div id="listing" class="page">
  <div class="shell">
    <div class="topbar">
      <div class="topbar-brand">
        <span class="logo-star">✦</span> 3D SCAPE
      </div>
      <div class="topbar-right">
        <button class="btn-profile">Profile</button>
        <span class="bell-icon">🔔</span>
      </div>
    </div>
    <div class="content">
      <div class="products-grid" id="productsGrid"></div>
    </div>
  </div>
</div>

<!-- ===== DETAIL PAGE ===== -->
<div id="detail" class="page">
  <div class="shell">
    <div class="topbar">
      <div class="topbar-brand">
        <span class="logo-star">✦</span> 3D SCAPE
      </div>
      <div class="topbar-right">
        <button class="btn-profile">Profile</button>
        <span class="bell-icon">🔔</span>
      </div>
    </div>
    <div class="content">
      <button class="back-btn" onclick="goTo('listing')"> Back</button>
      <div id="detailContent"></div>
    </div>
  </div>
</div>

<script>
const products = [
  {
    id: 1,
    name: "Magnetic Compass",
    icon: "🧭",
    description: "A magnetic compass used to find direction (North, South, East, West) using Earth's magnetic field. Essential tool for navigation and orientation in outdoor environments.",
    features: [
      "Accurate directional measurement",
      "Durable housing with clear markings",
      "Liquid-filled capsule for smooth needle movement",
      "Ideal for hiking, trekking, and field work",
      "Works without batteries or signal",
      "Lightweight and portable"
    ]
  },
  {
    id: 2,
    name: "MOviscop 6m Viewer",
    icon: "🔬",
    description: "A MOviscop used to view film strips or analyze motion and structure. Compatible with standard 6mm Cassette Format.",
    features: [
      "Produces clean, magnified images",
      "Supports standard 6mm film reels",
      "Built-in lens for clear focus",
      "Simple one-hand operation",
      "Durable and lens-friendly plastic housing",
      "Everything is manual, adjustable, and battery-based"
    ]
  },
  {
    id: 3,
    name: "Solar Lantern",
    icon: "🔦",
    description: "A solar-powered lantern that harvests energy from sunlight and provides illuminated light without electricity. Ideal for camping, outdoor use, and power outages.",
    features: [
      "Light sensing smart LED",
      "Built-in rechargeable battery",
      "Easy to carry — compact storage",
      "Up to 8 hrs of illuminated light",
      "Charging via sunlight for free charging",
      "1200 mAh lithium backup battery",
      "Smart on – Battery backup systems"
    ]
  },
  {
    id: 4,
    name: "Field Compass Pro",
    icon: "🗺️",
    description: "Professional-grade field compass designed for surveyors and outdoor professionals requiring precise bearing measurements.",
    features: [
      "360° graduated rotating bezel",
      "Sighting mirror with alignment line",
      "Declination adjustment for accurate readings",
      "High-contrast markings",
      "Weather-resistant casing"
    ]
  },
  {
    id: 5,
    name: "Portable LED Torch",
    icon: "💡",
    description: "A high-lumen portable torch with multiple brightness modes, suitable for fieldwork, emergencies, and outdoor adventures.",
    features: [
      "3 brightness modes: High, Medium, Low",
      "Shock-resistant aluminium body",
      "Water-resistant to IPX4",
      "Beam range up to 200m",
      "USB-C rechargeable"
    ]
  },
  {
    id: 6,
    name: "Surveying Prism",
    icon: "📐",
    description: "Precision optical prism used in land surveying to reflect the signal from a total station, enabling accurate distance measurements.",
    features: [
      "360° rotation for all-direction measurement",
      "High-quality optical glass",
      "Compatible with most total stations",
      "Durable metal housing",
      "Standard 5/8\" thread mount"
    ]
  }
];

function goTo(page, productId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  if (page === 'detail' && productId != null) {
    renderDetail(productId);
  }
  document.getElementById(page).classList.add('active');
  window.scrollTo(0, 0);
}

function renderGrid() {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = products.map(p => `
    <div class="product-card" onclick="goTo('detail', ${p.id})">
      <div class="product-card-placeholder">${p.icon}</div>
      <div class="product-card-name">${p.name}</div>
    </div>
  `).join('');
}

function renderDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-layout">
      <div class="detail-left">
        <div class="detail-name">${p.name}</div>
        <p class="detail-desc">${p.description}</p>
        <ul class="detail-list">
          ${p.features.map(f => `<li>${f}</li>`).join('')}
        </ul>
      </div>
      <div class="detail-images">
        <div class="detail-img-placeholder">${p.icon}</div>
        <div class="detail-img-placeholder" style="font-size:1.1rem;color:#8a9abf;">⬛</div>
        <div class="detail-img-placeholder" style="font-size:1.1rem;color:#8a9abf;">⬛</div>
      </div>
    </div>
  `;
}

renderGrid();
</script>
</body>
</html>
